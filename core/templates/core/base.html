<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Media Platform</title>
    <!-- Bootstrap 5 CSS & FontAwesome Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #fafafa; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: #262626; }
        
        /* Left Navigation Sidebar */
        .sidebar { position: fixed; top: 0; left: 0; height: 100vh; width: 240px; border-right: 1px solid #dbdbdb; background: #ffffff; padding: 24px 16px; z-index: 1000; }
        .sidebar-brand { font-size: 1.4rem; font-weight: 700; text-decoration: none; color: #000; display: block; margin-bottom: 28px; letter-spacing: -0.5px; }
        .nav-link-item { display: flex; align-items: center; gap: 14px; padding: 12px 16px; color: #262626; text-decoration: none; border-radius: 8px; font-weight: 500; font-size: 0.95rem; transition: background 0.2s ease; margin-bottom: 4px; }
        .nav-link-item:hover { background-color: #f2f2f2; }
        .nav-link-item i { font-size: 1.2rem; width: 22px; text-align: center; }

        /* Main Content Area */
        .main-wrapper { margin-left: 240px; padding: 30px 20px; min-height: 100vh; }
        
        /* Responsive Sidebar */
        @media (max-width: 991px) {
            .sidebar { width: 72px; padding: 20px 8px; }
            .sidebar-brand { display: none; }
            .nav-link-item span { display: none; }
            .main-wrapper { margin-left: 72px; }
        }
        @media (max-width: 576px) {
            .sidebar { position: fixed; bottom: 0; top: auto; height: 60px; width: 100%; border-right: none; border-top: 1px solid #dbdbdb; display: flex; justify-content: space-around; padding: 0; }
            .nav-link-item { padding: 10px; margin: 0; }
            .main-wrapper { margin-left: 0; margin-bottom: 60px; padding: 15px; }
        }

        /* Card Styling */
        .feed-card { background: #ffffff; border: 1px solid #dbdbdb; border-radius: 8px; margin-bottom: 24px; overflow: hidden; }
        .feed-card-header { padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; background: #fff; border-bottom: 1px solid #f0f0f0; }
        .avatar-sm { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; border: 1px solid #dbdbdb; }
        .avatar-lg { width: 90px; height: 90px; border-radius: 50%; object-fit: cover; border: 2px solid #0095f6; padding: 2px; }
        .post-media-img { width: 100%; max-height: 550px; object-fit: cover; }
        .action-btn { background: none; border: none; font-size: 1.3rem; padding: 0; cursor: pointer; color: #262626; transition: transform 0.1s ease; }
        .action-btn:hover { transform: scale(1.1); }
        .action-btn.liked { color: #ed4956; }
    </style>
</head>
<body>

    <!-- Sidebar Navigation -->
    <aside class="sidebar">
        <a href="{% url 'feed' %}" class="sidebar-brand">
            <i class="fa-solid fa-share-nodes text-primary me-2"></i>SocialApp
        </a>
        
        <a href="{% url 'feed' %}" class="nav-link-item">
            <i class="fa-solid fa-house"></i>
            <span>Home</span>
        </a>
        <a href="#" class="nav-link-item">
            <i class="fa-solid fa-clapperboard"></i>
            <span>Reels</span>
        </a>
        <a href="{% url 'create_post' %}" class="nav-link-item">
            <i class="fa-regular fa-square-plus"></i>
            <span>Create Post</span>
        </a>
        {% if user.is_authenticated %}
        <a href="{% url 'profile' user.username %}" class="nav-link-item">
            <i class="fa-regular fa-circle-user"></i>
            <span>Profile</span>
        </a>
        <a href="{% url 'logout' %}" class="nav-link-item text-danger mt-auto">
            <i class="fa-solid fa-right-from-bracket"></i>
            <span>Logout</span>
        </a>
        {% else %}
        <a href="{% url 'login' %}" class="nav-link-item">
            <i class="fa-solid fa-right-to-bracket"></i>
            <span>Log In</span>
        </a>
        <a href="{% url 'register' %}" class="nav-link-item">
            <i class="fa-solid fa-user-plus"></i>
            <span>Sign Up</span>
        </a>
        {% endif %}
    </aside>

    <!-- Main View -->
    <main class="main-wrapper">
        {% block content %}
        {% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
